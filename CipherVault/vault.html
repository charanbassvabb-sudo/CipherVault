        <body class="centered-page">
            <div class="vault-container">
                <h2>Store Your Passwords Securely</h2>
                <div class="input-group">
                    <input type="text" id="website-input" placeholder="Website" class="input-field">
                
                    
                    <input type="text" id="site-username-input" placeholder="Username" class="input-field">
                    
                    <div class="password-container">
                        <input type="password" id="password-input" placeholder="Password" class="input-field">
                        <i id="toggle-password" onclick="togglePassword('password-input', 'toggle-password')">👁️</i>
                    </div>
                </div>
        
                <!-- Save Password Button -->
                <button id="store-password-btn" class="btn btn-primary">Save Password</button>

        
                <!-- Show Saved Passwords Button -->
                    
                <button id="show-passwords-btn" class="btn btn-secondary">Show Saved Passwords</button>
            </div>
    
    
   
    

            <!-- Vault Container to Display Passwords -->
            <div id="vault" class="vault-container"></div>
        </div>
    </body>
    <script>
 const showPasswordsBtn = document.getElementById('show-passwords-btn');
let passwordsVisible = false;

if (showPasswordsBtn) {
showPasswordsBtn.addEventListener('click', () => {
    const loggedInUser = localStorage.getItem('username');
    if (loggedInUser) {
        const vault = document.getElementById('vault'); // Get the element containing passwords

        if (passwordsVisible) {
            // Hide passwords
            vault.style.display = 'none'; // Hide the vault (containing passwords)
            showPasswordsBtn.textContent = 'Show Stored Passwords'; // Change button text
            passwordsVisible = false;
        } else {
            // Show passwords
            getPasswords(loggedInUser); // Assuming this function fetches and displays the passwords
            vault.style.display = 'inline-block'; // Show the vault (containing passwords)
            showPasswordsBtn.textContent = 'Hide Stored Passwords'; // Change button text
            passwordsVisible = true;
        }
    } else {
        alert('Please log in first.');
    }
});
}
        
   </script>
