<body class="login-page">
    <header>
        <h1><a href="index.html">CipherVault</a></h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li class="dropdown">
                    <a href="#">Passwords ▾</a>
                    <ul class="dropdown-menu">
                        <li><a href="vault.html">Encrypt & Store</a></li>

                    </a>
                </div>

              
        </nav>
    </header>
    <p id="success-message" style="color: green;"></p>

    <!-- Left Side - Welcome Message -->
    <div class="welcome-text">
        <h1>Welcome<br>Back</h1> <!-- "Back" moved to a new line -->
        <p>Secure your passwords, secure your digital life. <br>Log in to access your encrypted vault</p>
    </div>

    <!-- Right Side - Login Form -->
    <div class="login-form">
        <h2>Sign In</h2>
        <label for="login-username">Username</label>
        <input type="text" id="login-username" placeholder="Enter username">
    
        <label for="login-password">Password</label>
    <div class="password-container">
        <input type="password" id="login-password" placeholder="Enter password">
        <i id="toggle-password-login" class="eye-icon" onclick="togglePassword('login-password', 'toggle-password-login')">👁️</i>
    </div>
        <button onclick="login()">Log In</button>

        <p class="signup-text">Don't have an account? <a href="register.html">Sign Up</a></xp>
